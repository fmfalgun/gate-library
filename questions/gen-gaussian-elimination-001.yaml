stem: |
  The augmented matrix of a system is $\left[\begin{array}{cc|c} 1 & 2 & 5 \\ 3 & 4 & 6 \end{array}\right]$.
  After the operation $R_2 \leftarrow R_2 - 3R_1$, what is the second row?
options:
  A: "$[\\,0\\ \\ -2\\ \\mid\\ -9\\,]$"
  B: "$[\\,0\\ \\ 10\\ \\mid\\ 21\\,]$"
  C: "$[\\,0\\ \\ -2\\ \\mid\\ 9\\,]$"
  D: "$[\\,0\\ \\ 2\\ \\mid\\ -9\\,]$"
answer: "A"
solution: |
  Subtract three times row 1, $[3\ 6 \mid 15]$, from row 2, $[3\ 4 \mid 6]$:
  $[3-3,\ 4-6 \mid 6-15] = [0\ -2 \mid -9]$.
fastest_method: |
  Only the last two entries change: $4 - 3\cdot 2 = -2$ and $6 - 3\cdot 5 = -9$.
trap: |
  Option B adds $3R_1$ instead of subtracting it.
